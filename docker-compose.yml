services:
  web:
    image: php:8.3-apache
    container_name: savoria-php-web
    ports:
      - "8095:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_DRIVER=sqlite
    command: >
      bash -c "a2enmod rewrite && mkdir -p /var/www/html/storage && chown -R www-data:www-data /var/www/html/storage && apache2-foreground"
